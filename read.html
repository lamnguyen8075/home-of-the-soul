<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff1e8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Đọc — Nhàn Thoại</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500..700&family=Lora:ital,wght@0,400;0,500;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body class="reader" data-theme="light">
  <div class="progress" id="progress"></div>

  <header class="r-bar">
    <div class="r-bar-inner" style="width:min(1180px,94vw);margin:0 auto">
      <div style="display:flex;align-items:center;gap:.8rem;min-width:0">
        <button class="tool menu-btn" id="menuBtn" aria-label="Mục lục">☰ Mục lục</button>
        <a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-text">Nhàn Thoại</span></a>
      </div>
      <div class="r-tools">
        <a class="tool dl-tool" href="assets/Nhan-Thoai-Nguyen-Hong-Phuc.pdf" download="Nhan-Thoai-Nguyen-Hong-Phuc.pdf" aria-label="Tải sách PDF">⬇ PDF</a>
        <button class="tool" id="searchBtn" aria-label="Tìm kiếm">🔍 Tìm kiếm</button>
        <span class="sizes">
          <button class="tool" id="smaller" aria-label="Chữ nhỏ hơn">A−</button>
          <button class="tool" id="bigger" aria-label="Chữ lớn hơn">A+</button>
        </span>
        <button class="swatch" data-t="light" aria-label="Nền sáng" aria-pressed="true"></button>
        <button class="swatch" data-t="sepia" aria-label="Nền giấy" aria-pressed="false"></button>
        <button class="swatch" data-t="night" aria-label="Nền buổi tối" aria-pressed="false"></button>
      </div>
    </div>
  </header>

  <div class="r-layout">
    <aside class="toc" id="toc">
      <div class="toc-head"><h2>Mục lục</h2><button class="tool close-toc" id="closeToc" type="button">✕ Đóng</button></div>
      <div class="drawer-size" aria-label="Cỡ chữ">
        <span>Cỡ chữ</span>
        <button class="tool" id="smaller2" aria-label="Chữ nhỏ hơn">A−</button>
        <button class="tool" id="bigger2" aria-label="Chữ lớn hơn">A+</button>
      </div>
      <a class="dl-card" id="dlCard" href="assets/Nhan-Thoai-Nguyen-Hong-Phuc.pdf" download="Nhan-Thoai-Nguyen-Hong-Phuc.pdf">
        <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></span>
        <span><b>Tải cả quyển sách (PDF)</b><small>Trình bày đẹp · có mục lục &amp; đánh dấu trang</small></span>
      </a>
      <form class="jump" id="jump">
        <label for="jumpN">Đến mục số</label>
        <div><input id="jumpN" type="number" inputmode="numeric" min="1" max="200" placeholder="1 – 200"><button class="tool" type="submit">Đi</button></div>
      </form>
      <div id="tocList"></div>
    </aside>

    <main>
      <article class="page" id="page"></article>
      <nav class="pager" id="pager">
        <button class="btn" id="prev">← Trang trước</button>
        <span class="pos" id="pos"></span>
        <button class="btn" id="next">Trang sau →</button>
      </nav>
    </main>
  </div>

  <!-- Search -->
  <div class="search" id="search" hidden>
    <div class="search-box" role="dialog" aria-label="Tìm kiếm">
      <input id="q" type="search" placeholder="Tìm trong cả quyển sách… (gõ không dấu cũng được)" autocomplete="off">
      <button class="tool" id="closeSearch">Đóng</button>
      <div class="search-meta" id="searchMeta"></div>
      <ol class="results" id="results"></ol>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="tx" id="toastTx"></span><button class="tool" id="toastBtn">Đọc từ đầu</button></div>

  <script src="reader.js?v=9"></script>
</body>
</html>
